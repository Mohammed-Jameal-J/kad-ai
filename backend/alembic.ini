# Database migrations. The database URL comes from app settings (DATABASE_URL / .env), see migrations/env.py.
#   python -m alembic revision --autogenerate -m "add something"   # after changing a model
#   python -m alembic upgrade head                                  # also runs automatically on startup

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
